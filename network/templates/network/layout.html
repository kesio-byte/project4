{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Social Network{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="{% static 'network/styles.css' %}" rel="stylesheet">
    <script src="{% static 'network/network.js' %}"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'index' %}">Network</a>
    <ul class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="#"><strong>{{ user.username }}</strong></a>
        </li>
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">All Posts</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'following' %}">Following</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Log Out</a></li>
      {% else %}
        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Log In</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
      {% endif %}
    </ul>
  </div>
</nav>

<div class="container mt-4">
  {% block body %}
  {% endblock %}
</div>

</body>
</html>
