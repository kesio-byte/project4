{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Social Network{% endblock %}</title>
   
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <!-- My CSS -->
    <link href="{% static 'network/styles.css' %}" rel="stylesheet">

    <!-- My JavaScript -->
    <script src="{% static 'network/network.js' %}"></script>
</head>
<body>

<!-- My Sticky Nav -->
<nav class="navbar navbar-expand-lg shadow-sm my-nav">
  <div class="container">
    <a class="navbar-brand fw-bold text-white" href="{% url 'index' %}">Network</a>
    <ul class="navbar-nav ms-auto">

      {% if user.is_authenticated %}

      <!-- if user is authenticated do the following please -->
        <a class="nav-link text-white text-capitalize" href="{% url 'profile' user.username %}">
          <strong>{{ user.username }}</strong>
        </a>

        </li>
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'index' %}">All Posts</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'following' %}">Following</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'logout' %}">Log Out</a></li>
      {% else %}
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'login' %}">Log In</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'register' %}">Register</a></li>
      {% endif %}
    </ul>
  </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
  {% block body %}
  {% endblock %}
</div>

<!--My Fixed Footer -->
<footer class="shadow-sm my-footer">
  <div class="container text-center py-2">
    <small class="text-white">&copy; 2026 Gananga Network | Built by Kesio</small>
  </div>
</footer>

</body>
</html>
